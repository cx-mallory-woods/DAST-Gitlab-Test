stages:
  - CxOneDast

dast-scan:
  stage: CxOneDast
  image: docker:latest
  services:
    - docker:dind
  script:
    - mkdir -p output
    - chmod 777 output
    - SCAN_RC=0
    - |
      docker run --name dast-scan --pull=always \
        -e CX_APIKEY=eyJhbGciOiJIUzUxMiIsInR5cCIgOiAiSldUIiwia2lkIiA6ICJkYzRkOGI5ZC0xMTA5LTQxMzUtOWNhOS0wOTRmOTQ2MzVjZGEifQ..VkD6NS3WCr0TeJdeX0bQ0L6KmBWV6ZTMpQq7j5XWO_Y2HEu31BlFpbI-Dxw8SXnPKrEM3uFIk3od7npYJIZwyA \
        checkmarx/dast:latest \
        scan \
        --environment-id=6544730c-cf51-4010-bff5-8f2257a57f4c \
        --base-url=https://cxone.checkmarx-gov.com \
        --output=/output || SCAN_RC=$?
    - docker cp dast-scan:/output/. ./output/ || true
    - docker rm dast-scan || true
    - exit $SCAN_RC
  artifacts:
    when: always
    paths:
      - output
