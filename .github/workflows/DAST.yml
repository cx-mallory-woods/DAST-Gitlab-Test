name: CxOne DAST

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  dast-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare output directory
        run: |
          mkdir -p output
          chmod 777 output

      - name: Run Checkmarx DAST
        env:
          CX_APIKEY: ${{ secrets.CX_APIKEY }}
        run: |
          docker run --pull=always \
            -e CX_APIKEY \
            -v "${{ github.workspace }}/output:/output:z" \
            checkmarx/dast:latest \
            scan \
            --environment-id=6544730c-cf51-4010-bff5-8f2257a57f4c \
            --base-url=https://cxone.checkmarx-gov.com \
            --output=/output

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-output
          path: output
